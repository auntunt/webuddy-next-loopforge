name: webuddy
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: webuddy
      MYSQL_USER: webuddy
      MYSQL_PASSWORD: ${WEBUDDY_DB_PASSWORD:?Run scripts/configure.sh first}
      MYSQL_ROOT_PASSWORD: ${WEBUDDY_DB_ROOT_PASSWORD:?Run scripts/configure.sh first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:${WEBUDDY_MYSQL_PORT:-33315}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u webuddy --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
  platform:
    profiles: [platform]
    # Published release stack: never builds. Bump the pinned tag (here and in
    # AGENTFLOW_ISOLATED_IMAGE) with each release; source builds use compose.dev.yaml.
    image: ${WEBUDDY_IMAGE:-ghcr.io/auntunt/webuddy-next-loopforge:2.0.0}
    ports:
      - "${WEBUDDY_BIND:-0.0.0.0}:${AGENTFLOW_HTTP_PORT:-8090}:8080"
    environment:
      WEBUDDY_CORE_DIR: /app/webuddy_core
      WEBUDDY_UPLOADED_REPOS_DIR: ${WEBUDDY_DATA_DIR:?Run scripts/configure.sh first}/uploaded-repos
      WEBUDDY_PYTHON: ${WEBUDDY_PYTHON:-}
      WEBUDDY_KB_SCAN_DIRS: ${WEBUDDY_KB_SCAN_DIRS:-}
      WEBUDDY_LLM_BASE_URL: ${WEBUDDY_LLM_BASE_URL:-}
      WEBUDDY_LLM_API_KEY: ${WEBUDDY_LLM_API_KEY:-}
      WEBUDDY_LLM_MODEL: ${WEBUDDY_LLM_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AGENTFLOW_DISABLE_ENV_PROBE: ${AGENTFLOW_DISABLE_ENV_PROBE:-}
      AGENTFLOW_HTTP_PORT: 8080
      AGENTFLOW_MYSQL_DSN: webuddy:${WEBUDDY_DB_PASSWORD}@tcp(mysql:3306)/webuddy
      AGENTFLOW_SESSION_SECRET: ${AGENTFLOW_SESSION_SECRET:?Run scripts/configure.sh first}
      AGENTFLOW_AUTH_REQUIRED: "true"
      AGENTFLOW_ALLOW_SIGNUP: ${AGENTFLOW_ALLOW_SIGNUP:-true}
      AGENTFLOW_SECURE_COOKIES: ${AGENTFLOW_SECURE_COOKIES:-false}
      AGENTFLOW_GITHUB_CLIENT_ID: ${AGENTFLOW_GITHUB_CLIENT_ID:-}
      AGENTFLOW_GONGFENG_HOST: ${AGENTFLOW_GONGFENG_HOST:-}
      AGENTFLOW_TAPD_HOST: ${AGENTFLOW_TAPD_HOST:-}
      AGENTFLOW_MCP_TOKEN: ${AGENTFLOW_MCP_TOKEN:-}
      AGENTFLOW_GIT_SSH_KNOWN_HOSTS: ${AGENTFLOW_GIT_SSH_KNOWN_HOSTS:-}
      AGENTFLOW_ASSISTANT_SESSION_DIR: /data/assistant
      AGENTFLOW_CONVERSATION_DIR: ${WEBUDDY_DATA_DIR}/conversations
      AGENTFLOW_CLARIFY_SESSION_DIR: /data/clarify
      AGENTFLOW_BASELINE_ALIGN_EXECUTOR: ${AGENTFLOW_BASELINE_ALIGN_EXECUTOR:-codex}
      AGENTFLOW_SKIP_CODEBUDDY_INSTALL: ${AGENTFLOW_SKIP_CODEBUDDY_INSTALL:-}
      AGENTFLOW_ASSISTANT_MODEL: ${AGENTFLOW_ASSISTANT_MODEL:-}
      AGENTFLOW_ASSISTANT_MODELS: ${AGENTFLOW_ASSISTANT_MODELS:-}
      AGENTFLOW_PREVIEW_PUBLIC_URL: ${AGENTFLOW_PREVIEW_PUBLIC_URL:-}
      AGENTFLOW_PLATFORM_MCP_URL: ${AGENTFLOW_PLATFORM_MCP_URL:-http://platform:8080}
      AGENTFLOW_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-webuddy}_default
      AGENTFLOW_LOCAL_SANDBOX: docker
      AGENTFLOW_ISOLATED_IMAGE: ${WEBUDDY_IMAGE:-ghcr.io/auntunt/webuddy-next-loopforge:2.0.0}
      HOME: ${WEBUDDY_DATA_DIR:?Run scripts/configure.sh first}/home
      AGENTFLOW_RUNNER_BINARY: /app/bin/agentflow-runner-{os}-{arch}
      AGENTFLOW_GATE_MCP_BINARY: /app/bin/agentflow-gate-mcp-{os}-{arch}
      # Claude Code is not bundled; it is installed from npm here on first use.
      AGENTFLOW_RUNTIME_CLI_DIR: ${WEBUDDY_DATA_DIR}/cli
    command: ["-workspaces", "${WEBUDDY_DATA_DIR}/workspaces"]
    volumes:
      - platform-data:/data
      # Docker sandboxes bind workspace paths on the host, so the data
      # directory keeps the same absolute path inside the container.
      - ${WEBUDDY_DATA_DIR}:${WEBUDDY_DATA_DIR}
      - ${WEBUDDY_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped
volumes:
  mysql-data:
  platform-data:
