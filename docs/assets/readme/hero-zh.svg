<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title">
  <title id="title">Webuddy 2.0 — 代码图谱驱动 · 全量智能审查 · 企业级可控交付工作台</title>
  <defs>
    <linearGradient id="wbBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#382C96"/>
      <stop offset="0.52" stop-color="#545DC2"/>
      <stop offset="1" stop-color="#7D98F7"/>
    </linearGradient>
    <linearGradient id="wbAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#382C96"/>
      <stop offset="0.5" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.82" cy="0.12" r="0.58">
      <stop offset="0" stop-color="#545DC2" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#545DC2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#E2E8F0"/>
    </pattern>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>
    <clipPath id="outerClip">
      <rect width="1280" height="420" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outerClip)">
    <rect width="1280" height="420" fill="#F8FAFC"/>
    <rect x="610" width="670" height="420" fill="url(#gridDots)" opacity="0.85"/>
    <rect width="1280" height="420" fill="url(#glow1)"/>
    <rect width="1280" height="420" fill="url(#glow2)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="21.5" fill="none" stroke="#E2E8F0"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <!-- Webuddy Brand Mark + Wordmark -->
    <g transform="translate(68, 54)">
      <rect width="60" height="60" rx="16" fill="url(#wbBadge)"/>
      <path d="M16 36 C16 26, 26 20, 34 26 C38 18, 48 20, 48 30 C48 39, 39 43, 29 43 C21 43, 16 40, 16 36 Z" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M23 34 C27 30, 33 30, 38 35" fill="none" stroke="#BAE6FD" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="44" cy="18" r="3" fill="#93C5FD"/>
      <text x="76" y="44" fill="#0F172A" font-size="44" font-weight="800" letter-spacing="-1.1">Webuddy</text>
      <rect x="284" y="17" width="52" height="26" rx="13" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="297" y="35" fill="#4338CA" font-size="14" font-weight="700">2.0</text>
    </g>

    <!-- Main Headline -->
    <text x="68" y="182" fill="#0F172A" font-size="37" font-weight="750" letter-spacing="-0.6">图谱驱动 · 全量审查 · 可控交付</text>
    <rect x="68" y="200" width="76" height="4.5" rx="2.25" fill="url(#wbAccent)"/>

    <!-- Subtitle -->
    <text x="68" y="242" fill="#475569" font-size="18">融合多语言代码图谱 (TMH)、AI 全量代码审查与多租户 SOP 流水线，</text>
    <text x="68" y="272" fill="#475569" font-size="18">让每一次 Agent 编码都有源码证据链、质量评测与 PR 闭环。</text>

    <!-- Feature Pills -->
    <g transform="translate(68, 306)">
      <rect x="0" y="0" width="166" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="16" y="21" fill="#334155" font-size="13" font-weight="600">📊 TMH 代码图谱 &amp; 状态机</text>

      <rect x="176" y="0" width="144" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="192" y="21" fill="#334155" font-size="13" font-weight="600">🔍 AI 全量代码审查</text>

      <rect x="330" y="0" width="196" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="346" y="21" fill="#334155" font-size="13" font-weight="600">🏢 多租户隔离 · 22 种 CLI</text>
    </g>

    <text x="68" y="372" fill="#64748B" font-size="13" font-weight="500">MIT 开源 · Docker 一键自托管 · 支持 GitHub / 私有 GitLab / SSH / 压缩包接入</text>

    <!-- Right Workbench Preview Card -->
    <g filter="url(#cardShadow)">
      <rect x="668" y="28" width="554" height="364" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    </g>
    <!-- Window Chrome -->
    <circle cx="692" cy="50" r="4.8" fill="#EF4444" opacity="0.85"/>
    <circle cx="708" cy="50" r="4.8" fill="#F59E0B" opacity="0.85"/>
    <circle cx="724" cy="50" r="4.8" fill="#10B981" opacity="0.85"/>
    <text x="744" y="54.5" fill="#334155" font-size="12.5" font-weight="600">Webuddy · 代码图谱与全量审查工作台</text>
    <rect x="1088" y="38" width="116" height="24" rx="12" fill="#EEF2FF"/>
    <text x="1101" y="54" fill="#4338CA" font-size="11.5" font-weight="600">🏢 核心研发空间</text>
    <path d="M668 70 H1222" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- TMH Knowledge Strip -->
    <rect x="690" y="84" width="510" height="58" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="708" y="107" fill="#0F172A" font-size="13" font-weight="700">代码知识库 · TMH 全量图谱已就绪</text>
    <text x="708" y="128" fill="#64748B" font-size="12">3 业务域 · 4 核心流程 · 4 状态机流转图 · 7/7 知识页通过 file:line 校验</text>
    <rect x="1108" y="97" width="76" height="26" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="1121" y="114" fill="#059669" font-size="11.5" font-weight="700">✓ 已溯源</text>

    <!-- SOP Execution & Review Pipeline -->
    <rect x="690" y="154" width="510" height="156" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="708" y="179" fill="#0F172A" font-size="13" font-weight="700">pstack · 小步迭代与实证交付 SOP</text>
    <text x="935" y="179" fill="#64748B" font-size="12">Runner: Codex + Claude · 智能评测 83/100</text>

    <!-- Pipeline Nodes -->
    <path d="M750 218 H826" stroke="#10B981" stroke-width="2"/>
    <path d="M854 218 H930" stroke="#10B981" stroke-width="2"/>
    <path d="M958 218 H1034" stroke="#10B981" stroke-width="2"/>
    <path d="M1062 218 H1138" stroke="#4F46E5" stroke-width="2"/>

    <circle cx="736" cy="218" r="13" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
    <path d="M732 218.2 l2.6 2.6 5.2-5.4" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <text x="712" y="248" fill="#334155" font-size="12" font-weight="600">图谱定位</text>

    <circle cx="840" cy="218" r="13" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
    <path d="M836 218.2 l2.6 2.6 5.2-5.4" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <text x="816" y="248" fill="#334155" font-size="12" font-weight="600">沙箱实现</text>

    <circle cx="944" cy="218" r="13" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
    <path d="M940 218.2 l2.6 2.6 5.2-5.4" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <text x="920" y="248" fill="#334155" font-size="12" font-weight="600">全量审查</text>

    <circle cx="1048" cy="218" r="13" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
    <path d="M1044 218.2 l2.6 2.6 5.2-5.4" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
    <text x="1024" y="248" fill="#334155" font-size="12" font-weight="600">智能评测</text>

    <circle cx="1152" cy="218" r="13" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
    <circle cx="1152" cy="218" r="4.5" fill="#4F46E5"/>
    <text x="1126" y="248" fill="#4338CA" font-size="12" font-weight="700">PR 已就绪</text>

    <!-- Delivery Badges -->
    <rect x="708" y="268" width="212" height="28" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="724" y="286.5" fill="#4338CA" font-size="12" font-weight="600">📚 经验已自动沉淀至共享知识库</text>

    <rect x="984" y="268" width="198" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="1001" y="286.5" fill="#059669" font-size="12" font-weight="700">🔗 查看 GitHub PR #1 · Open</text>

    <!-- Composer Bar -->
    <rect x="690" y="326" width="510" height="44" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="708" y="353" fill="#94A3B8" font-size="13">输入研发需求，@ 角色、代码图谱、SOP 或仓库直接交付…</text>
    <circle cx="1176" cy="348" r="14" fill="url(#wbBadge)"/>
    <path d="M1176 354 v-12 m-4.5 4.5 4.5-4.5 4.5 4.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
