name: image

on:
  pull_request:
    paths:
      - .dockerignore
      - Dockerfile
      - compose.yaml
      - compose.dev.yaml
      - start.sh
      - scripts/**
      - webuddy_core/**
      - .github/workflows/image.yml

permissions:
  contents: read

jobs:
  build:
    name: Build linux/amd64 and linux/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build and verify linux/amd64 runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: webuddy-image:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime tools and webuddy_core inside image
        run: bash scripts/test-runtime-image.sh webuddy-image:test
      - name: Build multi-platform release image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
